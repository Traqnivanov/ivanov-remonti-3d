name: Publish Static Work Preview

on:
  push:
    branches:
      - "feat/persistence-slice-v1"
      - "feat/p3-1-floor-finish-vertical-slice"
      - "feat/p3-2-openings-net-wall-quantity"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/work/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/work ci --no-audit --no-fund

      - name: Build static preview
        env:
          VITE_SUPABASE_URL: https://qjfpbxucrxrtpygusnuv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "Missing repository variable SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          npm --prefix apps/work run build

      - name: Publish dedicated preview branch
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            feat/persistence-slice-v1)
              PREVIEW_BRANCH="preview-persistence-slice-v1"
              ;;
            feat/p3-1-floor-finish-vertical-slice)
              PREVIEW_BRANCH="preview-p3-1-floor-finish"
              ;;
            feat/p3-2-openings-net-wall-quantity)
              PREVIEW_BRANCH="preview-p3-2-openings"
              ;;
            *)
              echo "No preview destination configured for ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

          rm -rf /tmp/ivanov-preview-dist
          mkdir -p /tmp/ivanov-preview-dist
          cp -R apps/work/dist/. /tmp/ivanov-preview-dist/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan "${PREVIEW_BRANCH}"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/ivanov-preview-dist/. .
          touch .nojekyll

          git add -A
          git commit -m "preview: publish vertical slice ${GITHUB_SHA}"
          git push --force origin "HEAD:${PREVIEW_BRANCH}"
