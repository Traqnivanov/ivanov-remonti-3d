name: Publish Smart Offer Live Preview

on:
  push:
    branches:
      - "feat/**"
      - "work/**"
      - "fix/**"
      - "review/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smart-offer-live-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/work/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/work ci --no-audit --no-fund

      - name: Build Smart Offer preview
        env:
          VITE_SUPABASE_URL: https://qjfpbxucrxrtpygusnuv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "Missing repository variable SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          npm --prefix apps/work run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/work/dist

      - name: Deploy live preview
        id: deployment
        uses: actions/deploy-pages@v4
