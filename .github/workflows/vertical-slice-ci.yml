name: Vertical Slice CI

on:
  push:
    branches:
      - "feat/vertical-slice-v1"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/work

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/work/package.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build


      - name: Browser smoke and desktop/mobile screenshots
        run: |
          set -euo pipefail

          VITE_SUPABASE_URL=https://qjfpbxucrxrtpygusnuv.supabase.co \
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_visual_only \
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vertical-slice-vite.log 2>&1 &
          SERVER_PID=$!
          CHROME_PID=""

          cleanup() {
            if [ -n "${CHROME_PID:-}" ]; then
              kill "$CHROME_PID" 2>/dev/null || true
            fi
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null

          google-chrome \
            --headless \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-sandbox \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/vertical-slice-chrome-profile \
            about:blank > /tmp/vertical-slice-chrome.log 2>&1 &
          CHROME_PID=$!

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          node scripts/browser-smoke.mjs http://127.0.0.1:4173

          kill "$CHROME_PID" 2>/dev/null || true
          wait "$CHROME_PID" 2>/dev/null || true
          CHROME_PID=""

          google-chrome --headless --disable-gpu --no-sandbox --window-size=1440,900 --screenshot=/tmp/persistence-login-desktop.png http://127.0.0.1:4173
          google-chrome --headless --disable-gpu --no-sandbox --window-size=1440,1000 --screenshot=/tmp/vertical-slice-client.png "http://127.0.0.1:4173/?preview=1"

      - name: Upload visual QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vertical-slice-visual-qa
          path: |
            /tmp/vertical-slice-work.png
            /tmp/vertical-slice-client.png
            /tmp/vertical-slice-mobile-work.png
            /tmp/vertical-slice-mobile-owner-preview.png
            /tmp/vertical-slice-mobile-client.png
            /tmp/p25b-projects-dialog-desktop.png
            /tmp/p25b-projects-dialog-mobile.png
            /tmp/p25c-mobile-dirty.png
            /tmp/p25c-mobile-conflict.png
            /tmp/p25c-mobile-discard.png
            /tmp/persistence-login-desktop.png
            /tmp/persistence-login-mobile.png
          if-no-files-found: error
