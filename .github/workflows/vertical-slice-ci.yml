name: Vertical Slice CI

on:
  push:
    branches:
      - "feat/vertical-slice-v1"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/work

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/work/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build


      - name: Capture desktop screenshot
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vertical-slice-vite.log 2>&1 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done
          google-chrome --headless --disable-gpu --no-sandbox --window-size=1440,1000 --screenshot=/tmp/vertical-slice-work.png http://127.0.0.1:4173
          google-chrome --headless --disable-gpu --no-sandbox --window-size=1440,1000 --screenshot=/tmp/vertical-slice-client.png "http://127.0.0.1:4173/?preview=1"
          kill $SERVER_PID || true

      - name: Upload visual QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vertical-slice-visual-qa
          path: |
            /tmp/vertical-slice-work.png
            /tmp/vertical-slice-client.png
          if-no-files-found: error
